<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img"><title>Adjustable focus strength applied to the Return slot sample in the comparison editor</title><defs><linearGradient id="space" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#101526"/><stop offset=".64" stop-color="#232641"/><stop offset="1" stop-color="#374469"/></linearGradient></defs><rect x="0" y="0" width="1200" height="500" rx="20" fill="url(#space)" stroke="none"/><text x="44" y="52" fill="#69e7eb" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1.8">NEUROTYPE  /  READER</text><text x="43" y="112" fill="#e8eaf4" font-family="sans-serif" font-size="50" font-weight="700" letter-spacing="0">One passage, two views.</text><rect x="44" y="151" width="1112" height="305" rx="17" fill="#10172b" stroke="#586180"/><path d="M44 214 L1156 214" stroke="#424b62"/><text x="70" y="190" fill="#e8eaf4" font-family="sans-serif" font-size="18" font-weight="650" letter-spacing="0">Focus strength</text><text x="221" y="190" fill="#69e7eb" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="0">40%</text><rect x="277" y="179" width="162" height="5" rx="2" fill="#39435a" stroke="none"/><rect x="277" y="179" width="65" height="5" rx="2" fill="#69e7eb" stroke="none"/><circle cx="342" cy="181" r="8" fill="#69e7eb"/><rect x="776" y="166" width="116" height="32" rx="16" fill="#171e34" stroke="none"/><text x="799" y="188" fill="#c7cedc" font-family="sans-serif" font-size="16" font-weight="400" letter-spacing="0">Edit text</text><rect x="896" y="166" width="106" height="32" rx="16" fill="#dfdefa" stroke="none"/><text x="914" y="188" fill="#231e41" font-family="sans-serif" font-size="16" font-weight="700" letter-spacing="0">Compare</text><text x="1027" y="188" fill="#c7cedc" font-family="sans-serif" font-size="16" font-weight="400" letter-spacing="0">Focus view</text><path d="M600 214 L600 456" stroke="#414d6a"/><text x="70" y="256" fill="#69e7eb" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1.8">01   INPUT STREAM</text><text xml:space="preserve" x="633" y="256" fill="#c0b0ff" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1.8">02   FOCUS OUTPUT</text><text x="70" y="302" fill="#cbd1df" font-family="sans-serif" font-size="22" font-weight="400" letter-spacing="0">Every Friday someone returned a leaf</text><text xml:space="preserve" x="633" y="302" fill="#e1e6ef" font-family="sans-serif" font-size="22"><tspan font-weight="700" fill="#fff49a">Ev</tspan>ery <tspan font-weight="700" fill="#fff49a">Fri</tspan>day <tspan font-weight="700" fill="#fff49a">som</tspan>eone <tspan font-weight="700" fill="#fff49a">retu</tspan>rned <tspan font-weight="700" fill="#fff49a">a</tspan> <tspan font-weight="700" fill="#fff49a">le</tspan>af</text><text x="70" y="336" fill="#cbd1df" font-family="sans-serif" font-size="22" font-weight="400" letter-spacing="0">through the library book slot. This week</text><text xml:space="preserve" x="633" y="336" fill="#e1e6ef" font-family="sans-serif" font-size="22"><tspan font-weight="700" fill="#fff49a">thr</tspan>ough <tspan font-weight="700" fill="#fff49a">th</tspan>e <tspan font-weight="700" fill="#fff49a">lib</tspan>rary <tspan font-weight="700" fill="#fff49a">bo</tspan>ok <tspan font-weight="700" fill="#fff49a">sl</tspan>ot. <tspan font-weight="700" fill="#fff49a">Th</tspan>is <tspan font-weight="700" fill="#fff49a">we</tspan>ek</text><text x="70" y="370" fill="#cbd1df" font-family="sans-serif" font-size="22" font-weight="400" letter-spacing="0">the leaf came with a wobbly drawing</text><text xml:space="preserve" x="633" y="370" fill="#e1e6ef" font-family="sans-serif" font-size="22"><tspan font-weight="700" fill="#fff49a">th</tspan>e <tspan font-weight="700" fill="#fff49a">le</tspan>af <tspan font-weight="700" fill="#fff49a">ca</tspan>me <tspan font-weight="700" fill="#fff49a">wi</tspan>th <tspan font-weight="700" fill="#fff49a">a</tspan> <tspan font-weight="700" fill="#fff49a">wob</tspan>bly <tspan font-weight="700" fill="#fff49a">dra</tspan>wing</text><text x="70" y="404" fill="#cbd1df" font-family="sans-serif" font-size="22" font-weight="400" letter-spacing="0">of a tree.</text><text xml:space="preserve" x="633" y="404" fill="#e1e6ef" font-family="sans-serif" font-size="22"><tspan font-weight="700" fill="#fff49a">o</tspan>f <tspan font-weight="700" fill="#fff49a">a</tspan> <tspan font-weight="700" fill="#fff49a">tr</tspan>ee.</text><circle cx="600" cy="345" r="17" fill="#25344d"/><path d="M591 345h18m-14-4-4 4 4 4m10-8 4 4-4 4" fill="none" stroke="#69e7eb" stroke-width="2"/></svg>
